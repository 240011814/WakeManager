[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# --partition-table：显式传自定义分区表，espflash 才会把 app 烧到 ota_0（0x20000），
# 否则默认写 0x10000（factory 布局的老偏移）→ OTA 双槽布局下启动报
# "No bootable app partitions"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v6.1"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

# Uncomment this if you have moved the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
#CARGO_WORKSPACE_DIR = { value = "", relative = true }
